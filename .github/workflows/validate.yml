name: Application validation
on:
  push:
    branches: ["main", "build/**", "docs/roadmap-00.03.01"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: twitchybutt
          POSTGRES_USER: twitchybutt
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U twitchybutt -d twitchybutt" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && '/tmp/twitchybutt-ci.sqlite' || 'twitchybutt' }}
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: twitchybutt
      DB_PASSWORD: ci-only-not-a-production-secret
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      CACHE_STORE: file
      CMS_PAYMENTS_ENABLED: 'false'
      CMS_RESTRICTED_PUBLISHING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Roadmap and release-policy regression checks
        run: |
          set -eu
          mkdir -p build
          git rev-parse HEAD > build/tested-commit.txt
          python3 -B docs/roadmap/validate.py
          python3 -B -m unittest discover -s tests/roadmap -v
          python3 -B -m unittest discover -s tests/security -v
      - name: Media worker prerequisites
        run: bash scripts/ci_media_prerequisites.sh
      - name: Fresh locked installation
        run: |
          set -eu
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          php --version
          composer --version
          test -f composer.lock
          php scripts/prepare.php
          cp .env.example .env
          if [ "$DB_CONNECTION" = sqlite ]; then touch "$DB_DATABASE"; fi
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
      - name: Dependency vulnerability audit and license inventory
        run: |
          set -eu
          composer audit --locked --no-interaction --format=json > build/audit.json
          composer licenses --format=json > build/dependency-licenses.json
          composer show --locked --format=json > build/dependency-inventory.json
      - name: PHP syntax, style, type analysis and targeted source checks
        run: |
          set -eu
          find app bootstrap config database routes scripts tests public -name '*.php' -not -name '*.blade.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          python3 scripts/security_scan.py
      - name: Migration forward, rollback and forward again
        run: |
          set -eu
          php artisan migrate --force
          php artisan migrate:rollback --force
          php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if(Illuminate\Support\Facades\Schema::hasTable("users")){exit(1);}'
          php artisan migrate --force
          php artisan cms:doctor
      - name: Unit, integration, regression and integer performance tests
        run: vendor/bin/phpunit --log-junit build/junit.xml
      - name: Compile configuration, routes and templates
        run: |
          set -eu
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
      - name: Real HTTP session and CSRF smoke test
        run: |
          set -eu
          APP_ENV=local php artisan serve --no-reload --host=127.0.0.1 --port=8765 > build/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 scripts/http_smoke.py
      - name: Account HTTP, loopback SMTP and concurrent recovery
        run: python3 -B scripts/account_http_smoke.py
      - name: MFA, session and concurrent single-use checks
        run: python3 -B scripts/mfa_http_smoke.py
      - name: Concurrent database attempt budgets
        run: python3 -B scripts/attempt_budget_smoke.py
      - name: Private media HTTP and real worker checks
        run: python3 -B scripts/media_http_smoke.py
      - name: Concurrent media quota reservations
        run: python3 -B scripts/media_quota_smoke.py
      - name: Validate locked production dependency install
        run: |
          set -eu
          rm -rf vendor
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan cms:doctor
          git diff --exit-code
      - name: Retain test evidence without application logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: validation-${{ matrix.database }}-${{ github.sha }}
          path: |
            build/tested-commit.txt
            build/junit.xml
            build/audit.json
            build/dependency-licenses.json
            build/dependency-inventory.json
            build/account-http.json
            build/mfa-http.json
            build/attempt-budget.json
            build/media-http.json
            build/media-quota.json
            build/media-tools.txt
            build/media-packages.txt
          retention-days: 30
          if-no-files-found: error
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Scan locked dependencies
        run: |
          set -eu
          mkdir -p build
          composer --version --no-ansi > build/composer-version.txt
          composer audit --locked --no-interaction --format=json > build/audit.json
      - name: SAST with pinned engine and local rules
        run: |
          set -eu
          IMAGE=semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          docker pull "$IMAGE"
          printf '%s\n' "$IMAGE" > build/semgrep-image.txt
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g -e HOME=/tmp -v "$PWD:/src:ro" -w /src "$IMAGE" semgrep scan --metrics=off --disable-version-check --disable-nosem --strict --jobs=2 --config security/semgrep.yml --json app bootstrap config database routes resources public > build/semgrep.json
      - name: Normalize scanner evidence
        if: always()
        run: |
          python3 -B scripts/security_evidence.py --commit "$(git rev-parse HEAD)" --version "$(cat VERSION)"
          cat build/security-evidence.json
      - name: Block unresolved above-Low findings
        run: python3 -B scripts/security_gate.py --development --evidence build/security-evidence.json --commit "$(git rev-parse HEAD)" --version "$(cat VERSION)"
      - name: Retain sanitized security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-${{ github.sha }}
          path: |
            build/security-evidence.json
            build/semgrep-image.txt
            build/composer-version.txt
          retention-days: 30
          if-no-files-found: error
  release-readiness:
    needs: [validate, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: security-${{ github.sha }}
          path: build
          digest-mismatch: error
      - name: Require complete current release approval
        run: python3 -B scripts/security_gate.py --evidence build/security-evidence.json --commit "$(git rev-parse HEAD)" --version "$(cat VERSION)"
