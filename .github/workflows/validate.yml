name: Application validation
on:
  push:
    branches: ["build/00.03.00"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check PHP and Composer availability
        run: |
          php --version
          composer --version
          php -m
