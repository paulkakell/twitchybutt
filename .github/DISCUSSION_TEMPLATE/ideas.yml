title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Discuss a problem and desired outcome before committing to an implementation.
        An idea is not a delivery promise. Accepted work receives a stable TB identifier in the roadmap.
        Do not post secrets, personal information, private media or security reports.
  - type: textarea
    id: problem
    attributes:
      label: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and success criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives, dependencies and related roadmap IDs
